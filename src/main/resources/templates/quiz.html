<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #4a4a4a;
        }

        form {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }

        p {
            font-weight: bold;
        }

        .choices {
            margin-left: 20px;
        }

        input[type="radio"] {
            margin-right: 10px; /* Add some space to the right of the radio buttons */
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #4cae4c; /* Darken the button on hover */
        }

        /* Optional: Style for better accessibility */
        input[type="radio"]:focus {
            outline: 2px solid #4cae4c; /* Highlight the focused radio button */
        }
    </style>
</head>
<body>
<h1>Quiz</h1>
<form action="/submit" method="post">
    <div th:each="question, iterStat : ${questions}">
        <p th:text="${question.question}"></p>
        <div class="choices" th:each="choice : ${question.choices}">
            <input type="radio" th:name="'answers[' + ${iterStat.index} + ']'" th:value="${choice}">
            <span th:text="${choice}"></span><br>
        </div>
    </div>
    <button type="submit">Submit</button>
</form>
</body>
</html>
